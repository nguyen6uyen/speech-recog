<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAPLIN | Silent Speech Interface</title>
    <style>
        :root {
            --primary: #00ff88;
            --bg: #0a0a0a;
            --card-bg: #111;
            --text: #fff;
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
        }

        h1 {
            margin: 0 0 10px 0;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(to bottom right, #fff, #888);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-header {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .main-container {
            display: grid;
            grid-template-columns: 640px 350px;
            gap: 20px;
            max-width: 1100px;
        }

        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid #222;
        }

        video,
        canvas {
            display: block;
            width: 640px;
            height: 480px;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        /* Sidebar Styling */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #222;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            font-size: 0.75rem;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #transcript-log {
            height: 350px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 5px;
        }

        .log-entry {
            background: #1a1a1a;
            padding: 12px 16px;
            border-radius: 10px;
            border-left: 3px solid var(--primary);
            animation: slideIn 0.3s ease-out;
        }

        .log-time {
            font-size: 0.65rem;
            color: #444;
            margin-bottom: 4px;
        }

        .log-text {
            font-size: 1rem;
            font-weight: 500;
            color: #eee;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .controls {
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }

        #record-btn {
            padding: 18px 60px;
            font-size: 1.1rem;
            font-weight: 700;
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #record-btn:hover {
            background: rgba(0, 255, 136, 0.1);
            transform: scale(1.02);
        }

        #record-btn.active {
            background: #ef4444;
            border-color: #ef4444;
            color: white;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
            }

            70% {
                box-shadow: 0 0 0 15px rgba(239, 68, 68, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        /* Loading Indicator */
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #888;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #333;
            border-radius: 50%;
        }

        .dot.loading {
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
            animation: blink 1s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }
    </style>
</head>

<body>
    <h1>CHAPLIN</h1>
    <div class="status-header">Visual Speech Recognition System</div>

    <div class="main-container">
        <!-- Viewport -->
        <div class="video-wrapper">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="card">
                <div class="card-header">Target Word / Sentence</div>
                <div id="latest-result"
                    style="font-size: 1.8rem; font-weight: 800; color: #fff; text-align: center; padding: 20px 10px; border: 2px dashed #222; border-radius: 12px; min-height: 80px; display: flex; align-items: center; justify-content: center;">
                    READY
                </div>
            </div>

            <div class="card">
                <div class="card-header">System Status</div>
                <div class="status-indicator">
                    <div id="status-dot" class="dot"></div>
                    <span id="status-text">Idle</span>
                </div>
            </div>

            <div class="card">
                <div class="card-header">History</div>
                <div id="transcript-log">
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button id="record-btn">Hold to Record</button>
    </div>

    <!-- MediaPipe Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <script>
        const videoElement = document.getElementById('video');
        const canvasElement = document.getElementById('canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const logContainer = document.getElementById('transcript-log');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        const recordBtn = document.getElementById('record-btn');

        const latestResult = document.getElementById('latest-result');
        const ALL_LIP_INDICES = [
            61, 146, 91, 181, 84, 17, 314, 405, 321, 375, 291, 308, 324, 318, 402, 317, 14, 87, 178, 88, 95, 78,
            185, 40, 39, 37, 0, 267, 269, 270, 409, 291, 308, 415, 310, 311, 312, 13, 82, 81, 80, 191
        ];

        let mediaRecorder;
        let videoBlobs = [];
        let isFirstLog = true;

        async function setupRecorder() {
            const stream = videoElement.srcObject;
            const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp8') ? 'video/webm;codecs=vp8' : 'video/mp4';
            mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) videoBlobs.push(e.data); };
        }

        function addLogEntry(text) {
            // Update big display
            latestResult.innerText = text;
            latestResult.style.borderColor = '#00ff88';
            setTimeout(() => latestResult.style.borderColor = '#222', 1000);

            if (isFirstLog) {
                logContainer.innerHTML = '';
                isFirstLog = false;
            }

            const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const entry = document.createElement('div');
            entry.className = 'log_entry'; // Using distinct name to avoid style clashes
            entry.style.cssText = "background: #1a1a1a; padding: 12px; border-radius: 10px; border-left: 3px solid #00ff88; margin-bottom: 10px;";
            entry.innerHTML = `
                <div style="font-size: 0.65rem; color: #444; margin-bottom: 4px;">${now}</div>
                <div style="font-size: 1rem; font-weight: 500;">${text}</div>
            `;
            logContainer.prepend(entry);
        }

        async function analyzeClips() {
            statusText.innerText = "Processing...";
            statusDot.classList.add('loading');
            latestResult.innerText = "THINKING...";

            const blob = new Blob(videoBlobs, { type: mediaRecorder.mimeType });
            const formData = new FormData();
            formData.append('file', blob, 'clip.webm');

            try {
                const res = await fetch("http://localhost:8000/predict_video", { method: 'POST', body: formData });
                const data = await res.json();

                if (data.status === "success") {
                    const result = data.refined_sentence || data.prediction || "(No speech detected)";
                    addLogEntry(result);
                    statusText.innerText = "Idle";
                } else {
                    addLogEntry("Error: Input too short");
                    statusText.innerText = "Idle";
                }
            } catch (err) {
                addLogEntry("Connection Error: Server offline");
                statusText.innerText = "Disconnected";
            } finally {
                statusDot.classList.remove('loading');
            }
        }

        recordBtn.onmousedown = async () => {
            if (!mediaRecorder) await setupRecorder();
            videoBlobs = [];
            mediaRecorder.start();
            recordBtn.innerText = "Recording...";
            recordBtn.classList.add('active');
            statusText.innerText = "Capturing...";
        };

        recordBtn.onmouseup = () => {
            mediaRecorder.stop();
            recordBtn.innerText = "Hold to Record";
            recordBtn.classList.remove('active');

            setTimeout(async () => {
                if (videoBlobs.length > 0) {
                    await analyzeClips();
                }
            }, 300);
        };

        function onResults(results) {
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            if (results.multiFaceLandmarks) {
                for (const landmarks of results.multiFaceLandmarks) {
                    drawConnectors(canvasCtx, landmarks, FACEMESH_LIPS, { color: '#00ff88', lineWidth: 1.5 });
                    for (const idx of ALL_LIP_INDICES) {
                        const lm = landmarks[idx];
                        canvasCtx.fillStyle = "#fff";
                        canvasCtx.beginPath();
                        canvasCtx.arc(lm.x * canvasElement.width, lm.y * canvasElement.height, 0.8, 0, 2 * Math.PI);
                        canvasCtx.fill();
                    }
                }
            }
        }

        const faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        faceMesh.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { await faceMesh.send({ image: videoElement }); },
            width: 640, height: 480
        });
        camera.start();

        videoElement.addEventListener('loadedmetadata', () => {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
        });
    </script>
</body>

</html>
