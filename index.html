<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Recognition | Silent Speech Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #C3110C;
            --primary-glow: rgba(0, 255, 136, 0.4);
            --bg: #D3EAF3;
            --surface: rgba(255, 255, 255, 0.03);
            --surface-border: rgba(255, 255, 255, 0.08);
            --text: #000000;
            --text-muted: #888;
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 15% 50%, rgba(0, 255, 136, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(70, 70, 255, 0.08), transparent 25%);
            color: var(--text);
            font-family: 'Outfit', system-ui, sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        h1 {
            margin: 0 0 5px 0;
            font-weight: 700;
            font-size: 3.5rem;
            letter-spacing: -2px;
            color: #000;
            display: inline-block;
        }

        .status-header {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 500;
            opacity: 0.8;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 340px;
            /* Sidebar slightly wider again */
            gap: 10px;
            /* Small gap to keep them close */
            max-width: 1080px;
            /* Reduced specific width to prevent huge gaps */
            width: 100%;
        }

        /* Glassmorphism Card Style */
        .glass-panel {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 4px solid #67C090;
            /* Off-White Border */
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .video-wrapper {
            position: relative;
            aspect-ratio: 4/3;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        video,
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        /* Sidebar Styling */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 24px;
            height: 100%;
        }

        .card {
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            font-size: 1.2rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #latest-result {
            font-size: 1.8rem;
            font-weight: 500;
            line-height: 1.3;
            color: #fff;
            text-align: center;
            padding: 30px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        #transcript-log {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
            max-height: 400px;
        }

        /* Custom Scrollbar */
        #transcript-log::-webkit-scrollbar {
            width: 6px;
        }

        #transcript-log::-webkit-scrollbar-track {
            background: transparent;
        }

        #transcript-log::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .log-entry {
            background: rgba(255, 255, 255, 0.15);
            /* More visible background */
            padding: 14px 18px;
            border-radius: 14px;
            border-left: 3px solid #B5E4DD;
            /* Match theme */
            transition: all 0.2s;
            margin-bottom: 8px;
        }

        .log-entry:hover {
            background: rgba(255, 255, 255, 0.25);
            border-left-color: #fff;
        }

        .log-time {
            font-size: 0.75rem;
            color: #666;
            /* Darker gray for light theme */
            margin-bottom: 4px;
            font-weight: 500;
        }

        .log-text {
            font-size: 1.1rem;
            /* Larger text */
            color: #000;
            font-weight: 500;
            /* Removed shadow for cleaner look on light bg */
        }


        /* Main Layout */
        .left-column {
            display: flex;
            flex-direction: column;
            gap: 24px;
            align-items: center;
        }

        /* Controls Area */
        .controls {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 100px;
            border: 4px solid #67C090;
            /* Off-White Border */
            backdrop-filter: blur(10px);
        }

        #record-btn {
            padding: 0;
            width: 80px;
            height: 80px;
            /* Flower Shape */
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            background: #FFB347;
            /* Light Orange (Idle) */
            border: 4px solid #FFF8DE;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 179, 71, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.4s ease-in-out;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes borderRotate {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        #record-btn::after {
            /* Inner "center" of flower */
            content: "";
            width: 40%;
            height: 40%;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
        }

        #record-btn:hover {
            box-shadow: 0 0 30px var(--primary-glow);
            transform: scale(1.05);
        }

        #record-btn.active {
            border-color: #ff4444;
            color: #ff4444;
            animation: pulse-border 1.5s infinite;
        }

        #record-btn.active::after {
            background: #ff4444;
            border-radius: 8px;
            width: 24px;
            height: 24px;
        }

        @keyframes pulse-border {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.4);
            }

            70% {
                box-shadow: 0 0 0 20px rgba(255, 68, 68, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 68, 68, 0);
            }
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--surface);
            padding: 10px 20px;
            border-radius: 100px;
            border: 1px solid var(--surface-border);
            backdrop-filter: blur(10px);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--primary);
        }

        input:checked+.slider:before {
            transform: translateX(20px);
        }

        /* Loading Dots */
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #444;
            border-radius: 50%;
        }

        /* Fast Mode Toggle Specifics */
        #fast-mode-toggle+.slider {
            background-color: rgba(255, 195, 0, 0.3);
            /* Lighter when OFF */
        }

        #fast-mode-toggle:checked+.slider {
            background-color: rgb(255, 195, 0) !important;
            /* Darker/Solid when ON */
        }

        /* Auto-Speak Toggle Specifics */
        #auto-speak-toggle+.slider {
            background-color: rgba(235, 76, 76, 0.3);
            /* Lighter Red when OFF */
        }

        #auto-speak-toggle:checked+.slider {
            background-color: #EB4C4C !important;
            /* Solid Red when ON */
        }

        .dot.loading {
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
            animation: blink 0.8s infinite;
        }

        /* RESPONSIVE DESIGN FOR MOBILE */
        @media (max-width: 900px) {
            body {
                padding: 20px 10px;
            }

            h1 {
                font-size: 2.5rem;
            }

            .main-container {
                display: flex;
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                order: 2;
                /* Ensure it stays below video */
            }

            .left-column {
                width: 100%;
                order: 1;
                /* Video on top */
            }

            .video-wrapper {
                border-radius: 16px;
            }

            .controls {
                flex-wrap: wrap;
                justify-content: center;
                padding: 15px;
                gap: 15px;
                width: 100%;
                box-sizing: border-box;
            }

            .toggle-container {
                font-size: 0.9rem;
                padding: 8px 16px;
            }

            #record-btn {
                width: 70px;
                height: 70px;
            }

            #latest-result {
                font-size: 1.4rem;
                padding: 20px;
                min-height: 100px;
            }
        }
    </style>
</head>

<body>
    <h1>Speech Recognition</h1>
    <div class="status-header">Visual Speech Recognition System</div>

    <div class="main-container">
        <!-- Left Column (Video + Controls) -->
        <div class="left-column">
            <!-- Viewport -->
            <div class="video-wrapper glass-panel">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas"></canvas>
            </div>

            <div class="controls">
                <div class="toggle-container">
                    <span style="font-size: 1.0rem; font-weight: 500; color: #000;">AUTO-SPEAK</span>
                    <label class="switch">
                        <input type="checkbox" id="auto-speak-toggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <button id="record-btn"></button>

                <div class="toggle-container">
                    <span style="font-size: 1.0rem; font-weight: 500; color: #4A0404;">⚡ FAST MODE</span>
                    <label class="switch">
                        <input type="checkbox" id="fast-mode-toggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="card glass-panel">
                <div class="card-header">
                    <span>Sentence</span>
                    <i style="opacity: 0.5; font-size: 1.2em;">LIVE</i>
                </div>
                <div id="latest-result">
                    READY
                </div>
            </div>

            <div class="card glass-panel">
                <div class="card-header">History</div>
                <div id="transcript-log">
                </div>
            </div>

            <div class="card glass-panel"
                style="flex-direction: row; justify-content: space-between; align-items: center; padding: 16px 24px;">
                <div class="status-indicator">
                    <div id="status-dot" class="dot"></div>
                    <span id="status-text">System Idle</span>
                </div>
            </div>
        </div>
    </div>

    <!-- MediaPipe Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <script>
        const videoElement = document.getElementById('video');
        const canvasElement = document.getElementById('canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const logContainer = document.getElementById('transcript-log');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        const recordBtn = document.getElementById('record-btn');
        const autoSpeakToggle = document.getElementById('auto-speak-toggle');
        const fastModeToggle = document.getElementById('fast-mode-toggle');

        const latestResult = document.getElementById('latest-result');
        const ALL_LIP_INDICES = [
            61, 146, 91, 181, 84, 17, 314, 405, 321, 375, 291, 308, 324, 318, 402, 317, 14, 87, 178, 88, 95, 78,
            185, 40, 39, 37, 0, 267, 269, 270, 409, 291, 308, 415, 310, 311, 312, 13, 82, 81, 80, 191
        ];

        let mediaRecorder;
        let videoBlobs = [];
        let isFirstLog = true;

        // --- MOBILE AUDIO FIX ---
        // Create a single AudioContext/Audio element to be unlocked by user gesture
        let audioContextUnlocked = false;
        const silentAudio = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAgZGF0YQQAAAAAAA==");

        function unlockAudio() {
            if (audioContextUnlocked) return;
            // Play silent audio on user gesture to unlock mobile browser audio
            silentAudio.play().then(() => {
                audioContextUnlocked = true;
                console.log("Audio Unlocked for Mobile");
            }).catch(e => console.log("Audio Unlock Failed (likely already permitted or error):", e));
        }
        // ------------------------

        async function setupRecorder() {
            const stream = videoElement.srcObject;
            const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp8') ? 'video/webm;codecs=vp8' : 'video/mp4';
            mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) videoBlobs.push(e.data); };
        }

        function addLogEntry(text) {
            // Update big display
            latestResult.innerText = text;
            latestResult.style.borderColor = '#00ff88';
            setTimeout(() => latestResult.style.borderColor = '#222', 1000);

            if (isFirstLog) {
                logContainer.innerHTML = '';
                isFirstLog = false;
            }

            const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `
                <div class="log-time">${now}</div>
                <div class="log-text">${text}</div>
            `;
            logContainer.prepend(entry);
        }

        async function speakText(text) {
            if (!text || text.length === 0) return;

            // Cancel any ongoing browser speech
            window.speechSynthesis.cancel();

            // Ensure audio context is ready (should be unlocked by now)
            if (!audioContextUnlocked) unlockAudio();

            try {
                // Try backend ElevenLabs TTS first
                const response = await fetch('/speak', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                if (response.ok) {
                    const audioBlob = await response.blob();
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const audio = new Audio(audioUrl);
                    audio.play().catch(e => console.error("Playback failed (mobile autoplay block?):", e));
                    return;
                } else {
                    console.warn("Backend TTS failed, falling back to browser voice.");
                }
            } catch (e) {
                console.error("TTS Error:", e);
            }

            // Fallback to Browser Voice
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;

            // Try to select a "natural" or "enhanced" voice if available
            const voices = window.speechSynthesis.getVoices();
            // Prefer "Google US English" or similar if present
            const preferredVoice = voices.find(v => v.name.includes("Google US English") || v.name.includes("Samantha")) || voices[0];
            if (preferredVoice) utterance.voice = preferredVoice;

            window.speechSynthesis.speak(utterance);
        }

        async function analyzeClips() {
            statusText.innerText = "Processing...";
            statusDot.classList.add('loading');
            latestResult.innerText = "THINKING...";

            const blob = new Blob(videoBlobs, { type: mediaRecorder.mimeType });
            const formData = new FormData();
            formData.append('file', blob, 'clip.webm');

            // Check Fast Mode status
            const isFastMode = fastModeToggle.checked;
            const url = `/predict_video?fast_mode=${isFastMode}`;

            try {
                const res = await fetch(url, { method: 'POST', body: formData });
                const data = await res.json();

                if (data.status === "success") {
                    const result = data.refined_sentence || data.prediction || "(No speech detected)";
                    addLogEntry(result);
                    statusText.innerText = "Idle";

                    if (autoSpeakToggle.checked && result && result !== "(No speech detected)") {
                        speakText(result);
                    }
                } else {
                    addLogEntry("Error: Input too short");
                    statusText.innerText = "Idle";
                }
            } catch (err) {
                addLogEntry("Connection Error: Server offline");
                statusText.innerText = "Disconnected";
            } finally {
                statusDot.classList.remove('loading');
            }
        }

        let recordingStartTime = 0;
        let isRecording = false;

        async function startRecording(e) {
            if (e.cancelable) e.preventDefault(); // Prevent text selection/scrolling on mobile
            if (isRecording) return; // Prevent double-firing

            // Unlock audio on first user interaction
            unlockAudio();

            isRecording = true;
            if (!mediaRecorder) await setupRecorder();
            videoBlobs = [];
            mediaRecorder.start();
            recordingStartTime = Date.now();
            statusText.innerText = "Listening...";
            statusDot.classList.add('loading');
        }

        function stopRecording(e) {
            if (e && e.cancelable) e.preventDefault();
            if (!isRecording) return;

            isRecording = false;
            const duration = Date.now() - recordingStartTime;

            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
            }

            recordBtn.classList.remove('active');

            if (duration < 1000) {
                // Too short
                statusText.innerText = "Too Short (<1s)";
                statusText.style.color = "#C3110C";
                setTimeout(() => {
                    statusText.innerText = "Idle";
                    statusText.style.color = "var(--text-muted)";
                }, 1500);
                videoBlobs = []; // Discard
                statusDot.classList.remove('loading');
                return;
            }

            statusText.innerText = "Processing...";

            setTimeout(async () => {
                if (videoBlobs.length > 0) {
                    await analyzeClips();
                }
            }, 300);
        }

        // Mouse Events
        recordBtn.addEventListener('mousedown', startRecording);
        recordBtn.addEventListener('mouseup', stopRecording);
        recordBtn.addEventListener('mouseleave', stopRecording); // Capture if mouse drags out

        // Touch Events (Mobile)
        recordBtn.addEventListener('touchstart', startRecording, { passive: false });
        recordBtn.addEventListener('touchend', stopRecording, { passive: false });
        recordBtn.addEventListener('touchcancel', stopRecording, { passive: false });

        function onResults(results) {
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            if (results.multiFaceLandmarks) {
                for (const landmarks of results.multiFaceLandmarks) {
                    drawConnectors(canvasCtx, landmarks, FACEMESH_LIPS, { color: '#00ff88', lineWidth: 1.5 });
                    for (const idx of ALL_LIP_INDICES) {
                        const lm = landmarks[idx];
                        canvasCtx.fillStyle = "#fff";
                        canvasCtx.beginPath();
                        canvasCtx.arc(lm.x * canvasElement.width, lm.y * canvasElement.height, 0.8, 0, 2 * Math.PI);
                        canvasCtx.fill();
                    }
                }
            }
        }

        const faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        faceMesh.onResults(onResults);

        // Check for Camera Support
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            statusText.innerText = "Camera Error";
            statusText.style.color = "#ff4444";
            alert("Error: Camera API is missing.\n\nPlease ensure you are using a secure context:\n- Use 'http://localhost:8000'\n- Do NOT use 'file://' or insecure IP addresses.");
        } else {
            const camera = new Camera(videoElement, {
                onFrame: async () => { await faceMesh.send({ image: videoElement }); },
                width: 640, height: 480
            });
            camera.start()
                .then(() => {
                    statusText.innerText = "Camera Ready";
                })
                .catch(err => {
                    console.error("Camera Start Error:", err);
                    statusText.innerText = "Camera Denied";
                    statusText.style.color = "#ff4444";
                });
        }

        videoElement.addEventListener('loadedmetadata', () => {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
        });
    </script>
</body>

</html>
