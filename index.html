<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaPipe Face Mesh - Lip Reading</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #0a0a0a;
            color: white;
            font-family: system-ui, sans-serif;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            margin: 0 0 20px 0;
            font-weight: 500;
            font-size: 1.5rem;
        }

        /* Container positions canvas overlay on top of video */
        .video-container {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        video,
        canvas {
            display: block;
        }

        /* Canvas sits exactly on top of video */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        /* =============================================
       PREDICTION OUTPUT BOX - Real-time lip reading
       ============================================= */
        .prediction-container {
            margin-top: 24px;
            width: 640px;
            max-width: 100%;
        }

        .prediction-label {
            font-size: 0.875rem;
            color: #888;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #333;
            transition: background 0.2s;
        }

        .status-dot.active {
            background: #00ff88;
            box-shadow: 0 0 8px #00ff88;
        }

        /* Main prediction display box */
        #prediction-box {
            background: #111;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 20px 24px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* High-contrast detected word text - large and readable for live demo */
        #detected-word {
            font-size: 3rem;
            font-weight: 700;
            color: #00ff88;
            /* Bright green for high contrast on dark */
            text-align: center;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.4);
            letter-spacing: 0.03em;
            transition: color 0.15s, text-shadow 0.15s;
            text-transform: uppercase;
        }

        /* Muted state when no confident prediction */
        #detected-word.no-detection {
            color: #444;
            text-shadow: none;
        }

        /* =============================================
       RECORD BUTTON
       ============================================= */
        .record-button-container {
            margin-top: 20px;
            width: 640px;
            max-width: 100%;
            display: flex;
            justify-content: center;
        }

        #record-btn {
            padding: 16px 48px;
            font-size: 1.25rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Default "Record" state */
        #record-btn.record-state {
            background: #1a1a1a;
            color: #00ff88;
            border: 2px solid #00ff88;
        }

        #record-btn.record-state:hover {
            background: #00ff88;
            color: #0a0a0a;
        }

        /* Active "Stop" state (recording in progress) */
        #record-btn.stop-state {
            background: #ff3030;
            color: white;
            border: 2px solid #ff3030;
            animation: pulse 1s infinite;
        }

        #record-btn.stop-state:hover {
            background: #cc2020;
            border-color: #cc2020;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(255, 48, 48, 0.4);
            }

            50% {
                box-shadow: 0 0 0 10px rgba(255, 48, 48, 0);
            }
        }
    </style>
</head>

<body>
    <h1>Lip Reading - Real-time Prediction</h1>

    <div class="video-container">
        <!-- Video element for webcam feed -->
        <video id="video" width="640" height="480" autoplay playsinline></video>
        <!-- Canvas overlay for drawing the mesh -->
        <canvas id="canvas" width="640" height="480"></canvas>
    </div>

    <!-- =============================================
       DETECTED SPEECH OUTPUT BOX
       Updates every frame with predicted word
       ============================================= -->
    <div class="prediction-container">
        <div class="prediction-label">
            <span class="status-dot" id="status-dot"></span>
            <span>Detected Speech</span>
        </div>

        <!-- Main prediction display - shows predictedWord variable -->
        <div id="prediction-box">
            <span id="detected-word">—</span>
        </div>
    </div>

    <!-- Record/Stop toggle button -->
    <div class="record-button-container">
        <button id="record-btn" class="record-state">Record</button>
    </div>

    <!-- Load MediaPipe dependencies from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <script>
        // ============================================
        // CONFIGURATION
        // ============================================

        // Confidence threshold: only display predictions above this value
        const CONFIDENCE_THRESHOLD = 0.6;

        // ============================================
        // LANDMARK INDICES FOR LIPS
        // ============================================
        // MediaPipe Face Mesh has 468 landmarks total.
        // These specific indices correspond to lip contours.

        // All lip landmarks (42 points) in the exact order the ML model expects
        const ALL_LIP_INDICES = [
            61, 146, 91, 181, 84, 17, 314, 405, 321, 375, 291, 308, 324, 318, 402, 317, 14, 87, 178, 88, 95, 78,
            185, 40, 39, 37, 0, 267, 269, 270, 409, 291, 308, 415, 310, 311, 312, 13, 82, 81, 80, 191
        ];

        // ============================================
        // DOM ELEMENTS
        // ============================================
        const videoElement = document.getElementById('video');
        const canvasElement = document.getElementById('canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const detectedWordElement = document.getElementById('detected-word');
        const statusDot = document.getElementById('status-dot');

        // ============================================
        // PREDICTED WORD VARIABLE
        // ============================================
        let predictedWord = "—";
        let aiRefinement = "";

        // ============================================
        // RECORDING STATE
        // ============================================
        let isRecording = false;
        let recordedFrames = [];
        const recordBtn = document.getElementById('record-btn');

        // ============================================
        // EXTRACT LIP LANDMARKS
        // ============================================
        function extractLipLandmarks(faceLandmarks) {
            // Returns just [x, y] coordinates in the correct order for the backend
            return ALL_LIP_INDICES.map(index => {
                const landmark = faceLandmarks[index];
                return [landmark.x, landmark.y];
            });
        }

        // ============================================
        // LIP READING MODEL INTEGRATION
        // ============================================
        async function predictFromLipMovement(lipCoordinates) {
            // In live mode, we just show "..." if the lips are moving
            const topLip = lipCoordinates[ALL_LIP_INDICES.indexOf(13)];
            const bottomLip = lipCoordinates[ALL_LIP_INDICES.indexOf(14)];
            const openness = Math.abs(bottomLip[1] - topLip[1]);

            if (openness > 0.02) {
                predictedWord = "...";
            } else if (predictedWord === "...") {
                predictedWord = "—";
            }
        }

        // ============================================
        // ANALYZE RECORDED LIP SEQUENCE
        // ============================================
        async function analyzeLipSequence(frames) {
            const API_URL = "http://localhost:8000/predict";

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: frames })
                });

                if (!response.ok) throw new Error("Server Error");

                const result = await response.json();

                if (result.status === "success") {
                    aiRefinement = result.refined_sentence || "";
                    return result.prediction;
                } else {
                    aiRefinement = "Low confidence";
                    return "—";
                }
            } catch (err) {
                console.error(err);
                aiRefinement = "Server Disconnected";
                return "ERR";
            }
        }

        // ============================================
        // RECORD BUTTON HANDLER
        // ============================================
        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                isRecording = true;
                recordedFrames = [];
                recordBtn.textContent = 'Stop';
                recordBtn.classList.remove('record-state');
                recordBtn.classList.add('stop-state');
                predictedWord = "—";
                aiRefinement = "Recording...";
                updateDetectedSpeechDisplay();
            } else {
                isRecording = false;
                recordBtn.textContent = 'Record';
                recordBtn.classList.remove('stop-state');
                recordBtn.classList.add('record-state');
                predictedWord = "Processing...";
                updateDetectedSpeechDisplay();

                if (recordedFrames.length > 5) {
                    predictedWord = await analyzeLipSequence(recordedFrames);
                } else {
                    predictedWord = "—";
                    aiRefinement = "Too short";
                }
                updateDetectedSpeechDisplay();
            }
        });

        // ============================================
        // UPDATE DETECTED SPEECH DISPLAY
        // ============================================
        function updateDetectedSpeechDisplay() {
            detectedWordElement.textContent = predictedWord;

            // If we have an AI refinement (from Step 4), show it below the raw prediction
            if (aiRefinement && predictedWord !== "Processing..." && isRecording === false) {
                const subText = document.createElement('div');
                subText.style.fontSize = "1rem";
                subText.style.color = "#888";
                subText.style.marginTop = "10px";
                subText.textContent = aiRefinement;
                detectedWordElement.appendChild(subText);
            }

            if (predictedWord && predictedWord !== "—" && predictedWord !== "...") {
                detectedWordElement.classList.remove('no-detection');
                statusDot.classList.add('active');
            } else {
                detectedWordElement.classList.add('no-detection');
                statusDot.classList.remove('active');
            }
        }

        // ============================================
        // DRAW FACE MESH ON CANVAS
        // ============================================
        function drawFaceMesh(landmarks) {
            // Use MediaPipe's drawing utilities for the full mesh
            // FACEMESH_TESSELATION draws the triangular mesh
            drawConnectors(
                canvasCtx,
                landmarks,
                FACEMESH_TESSELATION,
                { color: '#30303030', lineWidth: 1 }  // Subtle gray mesh
            );

            // Highlight the lip contours in a different color
            drawConnectors(
                canvasCtx,
                landmarks,
                FACEMESH_LIPS,
                { color: '#FF3030', lineWidth: 2 }  // Red for lips
            );

            // Draw small dots at each lip landmark
            for (const index of ALL_LIP_INDICES) {
                const landmark = landmarks[index];
                const x = landmark.x * canvasElement.width;
                const y = landmark.y * canvasElement.height;

                canvasCtx.beginPath();
                canvasCtx.arc(x, y, 2, 0, 2 * Math.PI);
                canvasCtx.fillStyle = '#00FF00';  // Green dots
                canvasCtx.fill();
            }
        }

        // ============================================
        // CALLBACK: PROCESS EACH FRAME
        // ============================================
        async function onResults(results) {
            // Clear the canvas each frame
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // Draw the video frame
            canvasCtx.drawImage(
                results.image,
                0, 0,
                canvasElement.width,
                canvasElement.height
            );

            // Check if any faces were detected
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                // Process first detected face only
                const faceLandmarks = results.multiFaceLandmarks[0];

                // Draw the mesh overlay
                drawFaceMesh(faceLandmarks);

                // Extract lip coordinates
                const lipCoordinates = extractLipLandmarks(faceLandmarks);

                // If recording, store frame data (do NOT update display)
                if (isRecording) {
                    recordedFrames.push(lipCoordinates);
                    return;  // Skip real-time prediction during recording
                }

                // Run prediction model on lip coordinates (only when not recording)
                // This updates the predictedWord variable
                await predictFromLipMovement(lipCoordinates);

                // Update the detected speech display box (every frame)
                updateDetectedSpeechDisplay();

            } else {
                // No face detected - reset to default (only when not recording)
                if (!isRecording) {
                    predictedWord = "—";
                    updateDetectedSpeechDisplay();
                }
            }
        }

        // ============================================
        // INITIALIZE FACE MESH
        // ============================================
        const faceMesh = new FaceMesh({
            locateFile: (file) => {
                // Load model files from CDN
                return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
            }
        });

        // Configure Face Mesh options
        faceMesh.setOptions({
            maxNumFaces: 1,              // Track only one face
            refineLandmarks: true,       // More accurate lip/eye landmarks
            minDetectionConfidence: 0.5, // Minimum confidence to detect
            minTrackingConfidence: 0.5   // Minimum confidence to track
        });

        // Register our callback function
        faceMesh.onResults(onResults);

        // ============================================
        // INITIALIZE WEBCAM
        // ============================================
        // Using MediaPipe's Camera utility for easy frame handling
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                // Send each video frame to Face Mesh for processing
                await faceMesh.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });

        // Start the camera
        camera.start()
            .then(() => {
                console.log('Camera started successfully');
            })
            .catch((error) => {
                console.error('Camera error:', error);
                predictedWord = "CAM ERROR";
                updateDetectedSpeechDisplay();
            });
    </script>
</body>

</html>
